  // ---------- Day summary modal (incl. extras/snacks) ----------
  function personExtrasTotals(day, profileId){
    var list = (day.extras && day.extras[profileId]) || [];
    return sumMacros(list, itemMacros);
  }
  function sharedMealsTotals(day){
    var sum = { calories:0, protein:0, carbs:0, fat:0 };
    MEAL_SLOTS.forEach(function(slot){
      var rid = day.meals[slot.key];
      var r = rid && state.recipes[rid];
      if (!r) return;
      var per = recipePerServing(r);
      sum.calories += per.calories; sum.protein += per.protein; sum.carbs += per.carbs; sum.fat += per.fat;
    });
    return sum;
  }

  function openDaySummary(mKey, iso, dateObj){
    var day = getDay(mKey, iso);

    function summaryTableHtml(consumed, goal){
      function row(label, c, g){
        var remaining = g - c;
        return '<tr><td>'+label+'</td><td class="num">'+fmtG(c)+'</td><td class="num">'+fmtG(g)+'</td><td class="num'+(remaining<0?" remaining-neg":"")+'">'+fmtG(remaining)+'</td></tr>';
      }
      return '<table class="summary-table"><thead><tr><th></th><th>Consumed</th><th>Goal</th><th>Remaining</th></tr></thead><tbody>' +
        row("Calories", consumed.calories, goal.calories) +
        row("Protein g", consumed.protein, goal.protein) +
        row("Carbs g", consumed.carbs, goal.carbs) +
        row("Fat g", consumed.fat, goal.fat) +
        '</tbody></table>';
    }

    function extrasListHtml(profileId){
      var list = (day.extras && day.extras[profileId]) || [];
      if (!list.length) return '<div class="receipt-empty" style="padding:8px 0;">No extras logged.</div>';
      return list.map(function(ex, idx){
        var m = itemMacros(ex);
        return '<div class="extra-item" data-pid="'+profileId+'" data-idx="'+idx+'">' +
          '<span class="extra-name">' + escapeHtml(ex.foodRef.description) + (ex.foodRef.brand? ' <span class="ing-brand">· '+escapeHtml(ex.foodRef.brand)+'</span>':'') + '</span>' +
          '<span class="extra-cals">' + (m.unresolved?"—":fmtCal(m.calories)+" cal") + '</span>' +
          overrideControlHtml("extra-"+profileId+"-"+idx) +
          (ex.override ? '<span class="edited-badge">Edited</span>' : '') +
          '<button type="button" class="icon-btn extra-remove" aria-label="Remove extra">&times;</button>' +
        '</div>';
      }).join("");
    }

    function snackLibraryOptionsHtml(){
      var ids = Object.keys(state.snacksLibrary);
      if (!ids.length) return '<option value="">No saved snacks yet</option>';
      return '<option value="">Choose a saved snack…</option>' + ids.map(function(id){
        var s = state.snacksLibrary[id];
        return '<option value="'+id+'">'+escapeHtml(s.foodRef.description)+(s.foodRef.brand?' ('+escapeHtml(s.foodRef.brand)+')':'')+'</option>';
      }).join("");
    }

    function bodyHtml(){
      var shared = sharedMealsTotals(day);
      return (
        '<h2>Day Summary</h2>' +
        '<div class="modal-sub">' + dateObj + '</div>' +
        '<div class="field"><label>Shared meals total</label>' + macroRowHtml(shared, false) + '</div>' +
        state.goals.profiles.map(function(p){
          var extras = personExtrasTotals(day, p.id);
          var consumed = { calories: shared.calories+extras.calories, protein: shared.protein+extras.protein, carbs: shared.carbs+extras.carbs, fat: shared.fat+extras.fat };
          return '<div class="person-summary-card"><h3>' + escapeHtml(p.name) + '</h3>' +
            summaryTableHtml(consumed, p) +
            '<div style="margin-top:10px;"><strong style="font-size:0.85rem;">Extras</strong>' +
            '<div class="extra-list" id="extraList-'+p.id+'">' + extrasListHtml(p.id) + '</div>' +
            '<div class="field-row" style="margin-top:8px;">' +
              '<div class="field"><select id="snackPick-'+p.id+'">' + snackLibraryOptionsHtml() + '</select></div>' +
              '<button type="button" class="pill-btn ghost small" data-add-saved="'+p.id+'">Add saved</button>' +
              '<button type="button" class="pill-btn primary small" data-add-new="'+p.id+'">+ Log new extra</button>' +
            '</div>' +
            '</div>' +
          '</div>';
        }).join("") +
        '<div class="modal-actions"><span class="spacer"></span><button type="button" class="pill-btn ghost" id="closeSummaryBtn">Close</button></div>'
      );
    }

    var modal = openModal(bodyHtml(), { wide:true, onMount: function(overlay, api){ wire(overlay, api); }});

    function refresh(overlay, api){
      var scrollPos = overlay.scrollTop;
      overlay.querySelector(".modal").innerHTML = bodyHtml();
      wire(overlay, api);
      overlay.scrollTop = scrollPos;
      renderReceipt();
    }

    function saveSnackToLibrary(item){
      var dupe = Object.keys(state.snacksLibrary).find(function(id){
        var s = state.snacksLibrary[id];
        return s.foodRef.description === item.foodRef.description && s.foodRef.brand === item.foodRef.brand &&
          s.amount === item.amount && s.unit === item.unit;
      });
      if (dupe) return;
      var id = uid();
      state.snacksLibrary[id] = JSON.parse(JSON.stringify(item));
      state.snacksLibrary[id].id = id;
    }

    function wire(overlay, api){
      overlay.querySelector("#closeSummaryBtn").addEventListener("click", function(){ api.close(); });
      state.goals.profiles.forEach(function(p){
        overlay.querySelectorAll('[data-pid="'+p.id+'"] .extra-remove').forEach(function(btn){
          var row = btn.closest(".extra-item");
          btn.addEventListener("click", function(){
            var idx = parseInt(row.getAttribute("data-idx"),10);
            day.extras[p.id].splice(idx,1);
            persist();
            refresh(overlay, api);
          });
        });
        overlay.querySelectorAll('[data-pid="'+p.id+'"] [data-override-target]').forEach(function(btn){
          var row = btn.closest(".extra-item");
          btn.addEventListener("click", function(){
            var idx = parseInt(row.getAttribute("data-idx"),10);
            var item = day.extras[p.id][idx];
            openOverrideEditor(itemMacros(item), item.override, function(val){
              item.override = val; persist(); refresh(overlay, api);
            }, function(){ item.override = null; persist(); refresh(overlay, api); });
          });
        });
        var addSavedBtn = overlay.querySelector('[data-add-saved="'+p.id+'"]');
        if (addSavedBtn) addSavedBtn.addEventListener("click", function(){
          var sel = overlay.querySelector("#snackPick-"+p.id);
          var snackId = sel.value;
          if (!snackId) return;
          var snack = state.snacksLibrary[snackId];
          if (!snack) return;
          if (!day.extras[p.id]) day.extras[p.id] = [];
          day.extras[p.id].push(JSON.parse(JSON.stringify(snack)));
          persist();
          refresh(overlay, api);
        });
        var addNewBtn = overlay.querySelector('[data-add-new="'+p.id+'"]');
        if (addNewBtn) addNewBtn.addEventListener("click", function(){
          openNutritionLookup(function(item){
            if (!day.extras[p.id]) day.extras[p.id] = [];
            day.extras[p.id].push(item);
            saveSnackToLibrary(item);
            persist();
            refresh(overlay, api);
          });
        });
      });
    }
  }

  // ---------- Rendering: header, week nav, planner grid ----------
  var monthSubtitleEl = document.getElementById("monthSubtitle");
  var monthSwitcherEl = document.getElementById("monthSwitcher");
  var weekLabelEl = document.getElementById("weekLabel");
  var prevWeekBtn = document.getElementById("prevWeekBtn");
  var nextWeekBtn = document.getElementById("nextWeekBtn");
  var plannerGridEl = document.getElementById("plannerGrid");
  var receiptCardEl = document.getElementById("receiptCard");
  var syncBannerEl = document.getElementById("syncBanner");

  function currentWeeks(){ return buildCalendarWeeks(state.currentMonth); }

  function renderHeader(){
    monthSubtitleEl.textContent = monthLabel(state.currentMonth);
    var keys = Object.keys(state.months).sort();
    monthSwitcherEl.innerHTML = keys.map(function(k){
      return '<option value="'+k+'"'+(k===state.currentMonth?" selected":"")+'>'+escapeHtml(monthLabel(k))+'</option>';
    }).join("");
  }

  function renderWeekNav(){
    var weeks = currentWeeks();
    var idx = clamp(state.currentWeekIndex, 0, weeks.length-1);
    state.currentWeekIndex = idx;
    weekLabelEl.textContent = "Week " + (idx+1) + " of " + monthLabel(state.currentMonth);
    prevWeekBtn.disabled = idx === 0;
    nextWeekBtn.disabled = idx === weeks.length-1;
  }

  function mealCellContent(mKey, iso, slot){
    var day = getDay(mKey, iso);
    var rid = day.meals[slot.key];
    var recipe = rid ? state.recipes[rid] : null;
    if (!recipe) return null;
    var per = recipePerServing(recipe);
    return { name: recipe.name, calories: fmtCal(per.calories) };
  }

  function renderPlannerGrid(){
    var weeks = currentWeeks();
    var idx = clamp(state.currentWeekIndex, 0, weeks.length-1);
    var week = weeks[idx];
    var mKey = state.currentMonth;
    var pm = parseMonthKey(mKey);
    plannerGridEl.innerHTML = "";

    plannerGridEl.appendChild(document.createElement("div"));

    week.forEach(function(slotDay, dowIdx){
      if (!slotDay) {
        var blank = document.createElement("div");
        blank.className = "col-blank";
        plannerGridEl.appendChild(blank);
        return;
      }
      var dateObj = new Date(pm.year, pm.month, slotDay.day);
      var isToday = slotDay.iso === todayIso();
      var head = document.createElement("button");
      head.type = "button";
      head.className = "col-head" + (isToday ? " today" : "");
      head.innerHTML = '<div class="dow">' + DOW_NAMES[dowIdx] + '</div><div class="ddate">' + MONTH_NAMES[pm.month].slice(0,3) + ' ' + slotDay.day + '</div>';
      head.setAttribute("aria-label", "View day summary for " + DOW_NAMES[dowIdx] + " " + MONTH_NAMES[pm.month] + " " + slotDay.day);
      head.addEventListener("click", function(){
        openDaySummary(mKey, slotDay.iso, DOW_NAMES[dowIdx] + ", " + MONTH_NAMES[pm.month] + " " + slotDay.day);
      });
      plannerGridEl.appendChild(head);
    });

    MEAL_SLOTS.forEach(function(slot){
      var rowLabel = document.createElement("div");
      rowLabel.className = "row-label";
      rowLabel.textContent = slot.label;
      plannerGridEl.appendChild(rowLabel);

      week.forEach(function(slotDay){
        if (!slotDay) {
          var blank = document.createElement("div");
          blank.className = "meal-cell blank-cell";
          plannerGridEl.appendChild(blank);
          return;
        }
        var content = mealCellContent(mKey, slotDay.iso, slot);
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "meal-cell" + (content ? " filled" : "");
        if (content) {
          btn.innerHTML = '<span class="meal-name">' + escapeHtml(content.name) + '</span><span class="meal-count">' + content.calories + ' cal/serving</span>';
          btn.setAttribute("aria-label", slot.label + ": " + content.name + ", " + content.calories + " calories per serving. Click to view.");
        } else {
          btn.textContent = "+ Add";
          btn.setAttribute("aria-label", "Assign " + slot.label.toLowerCase() + " for " + slotDay.iso);
        }
        btn.addEventListener("click", function(){
          var day = getDay(mKey, slotDay.iso);
          var rid = day.meals[slot.key];
          if (rid && state.recipes[rid]) openRecipeDetail(mKey, slotDay.iso, slot, rid);
          else openAssignMealModal(mKey, slotDay.iso, slot);
        });
        plannerGridEl.appendChild(btn);
      });
    });
  }

  // ---------- Grocery aggregation + receipt ----------
  function aggregateGroceryForWeek(){
    var weeks = currentWeeks();
    var idx = clamp(state.currentWeekIndex, 0, weeks.length-1);
    var week = weeks[idx];
    var mKey = state.currentMonth;
    var counts = {};
    week.forEach(function(slotDay){
      if (!slotDay) return;
      var day = getDay(mKey, slotDay.iso);
      MEAL_SLOTS.forEach(function(slot){
        var rid = day.meals[slot.key];
        var recipe = rid && state.recipes[rid];
        if (!recipe) return;
        recipe.ingredients.forEach(function(item){
          var name = ingredientDisplayName(item);
          var brand = item.foodRef && item.foodRef.brand ? item.foodRef.brand : "";
          var key = (name + "|" + brand + "|" + item.unit).toLowerCase();
          if (!counts[key]) counts[key] = { name: name, brand: brand, unit: item.unit, amount: 0 };
          counts[key].amount += item.amount;
        });
      });
    });
    return counts;
  }

  function buildReceiptData(){
    var mKey = state.currentMonth;
    var idx = state.currentWeekIndex;
    var wg = getWeekGrocery(mKey, idx);
    var counts = aggregateGroceryForWeek();
    var byCategory = {};
    CATEGORY_ORDER.forEach(function(c){ byCategory[c] = []; });

    Object.keys(counts).sort().forEach(function(key){
      var entry = counts[key];
      var itemKey = "agg:" + key;
      var amt = Math.round(entry.amount*100)/100;
      var display = amt + " " + entry.unit + " " + (entry.brand ? entry.brand + " " : "") + entry.name;
      byCategory[categorize(entry.name)].push({
        itemKey: itemKey, display: display, checked: !!wg.checkedItems[itemKey], removable: false
      });
    });

    wg.extras.forEach(function(extra){
      var itemKey = "extra:" + extra.id;
      byCategory[categorize(extra.name)].push({
        itemKey: itemKey, display: extra.name, checked: !!wg.checkedItems[itemKey], removable: true, extraId: extra.id
      });
    });

    return byCategory;
  }

  function renderReceipt(){
    var mKey = state.currentMonth;
    var idx = state.currentWeekIndex;
    var wg = getWeekGrocery(mKey, idx);
    var byCategory = buildReceiptData();

    var totalItems = 0, checkedCount = 0;
    CATEGORY_ORDER.forEach(function(c){
      byCategory[c].forEach(function(item){ totalItems++; if (item.checked) checkedCount++; });
    });

    var html = "";
    html += '<div class="receipt-title">Grocery Receipt</div>';
    html += '<div class="receipt-sub">Week ' + (idx+1) + ' · ' + monthLabel(mKey) + '</div>';
    html += '<hr class="receipt-divider">';

    if (totalItems === 0) {
      html += '<div class="receipt-empty">No items yet.<br>Assign recipes or type an item below.</div>';
    } else {
      CATEGORY_ORDER.forEach(function(cat){
        var items = byCategory[cat];
        if (!items.length) return;
        html += '<div class="receipt-category"><div class="receipt-category-title">' + escapeHtml(cat) + '</div>';
        items.forEach(function(item){
          html += '<div class="receipt-item' + (item.checked ? ' checked' : '') + '">';
          html += '<input type="checkbox" id="chk-' + escapeAttr(item.itemKey) + '" data-itemkey="' + escapeAttr(item.itemKey) + '"' + (item.checked ? ' checked' : '') + ' aria-label="Mark ' + escapeAttr(item.display) + ' as ' + (item.checked ? 'not purchased' : 'purchased') + '">';
          html += '<label for="chk-' + escapeAttr(item.itemKey) + '">' + escapeHtml(item.display) + '</label>';
          if (item.removable) html += '<button type="button" class="remove-btn" data-remove-extra="' + escapeAttr(item.extraId) + '" aria-label="Remove ' + escapeAttr(item.display) + ' from list">&times;</button>';
          html += '</div>';
        });
        html += '</div>';
      });
    }

    html += '<hr class="receipt-divider">';
    html += '<form class="receipt-add" id="extraForm"><label for="extraInput" class="visually-hidden">Add a one-off grocery item</label>' +
      '<input type="text" id="extraInput" placeholder="Add item…" autocomplete="off">' +
      '<button type="submit" aria-label="Add item to grocery list">Add</button></form>';
    html += '<div class="receipt-links">' +
      '<button type="button" id="clearCheckedBtn"' + (checkedCount === 0 ? ' disabled' : '') + '>Clear checked</button>' +
      '<button type="button" id="clearWeekBtn"' + (totalItems === 0 ? ' disabled' : '') + '>Clear this week</button></div>';
    html += '<div class="receipt-footer">' + totalItems + ' item' + (totalItems === 1 ? '' : 's') + ' · ' + checkedCount + ' checked</div>';

    receiptCardEl.innerHTML = html;

    receiptCardEl.querySelectorAll('input[type="checkbox"][data-itemkey]').forEach(function(cb){
      cb.addEventListener("change", function(){
        wg.checkedItems[cb.getAttribute("data-itemkey")] = cb.checked;
        persist();
        renderReceipt();
      });
    });
    receiptCardEl.querySelectorAll('[data-remove-extra]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-remove-extra");
        wg.extras = wg.extras.filter(function(ex){ return String(ex.id) !== String(id); });
        delete wg.checkedItems["extra:" + id];
        persist();
        renderReceipt();
      });
    });
    var extraForm = document.getElementById("extraForm");
    extraForm.addEventListener("submit", function(ev){
      ev.preventDefault();
      var input = document.getElementById("extraInput");
      var val = input.value.trim();
      if (!val) return;
      wg.extras.push({ id: uid(), name: val });
      persist();
      renderReceipt();
      var newInput = document.getElementById("extraInput");
      if (newInput) newInput.focus();
    });
    document.getElementById("clearCheckedBtn").addEventListener("click", function(){
      wg.extras = wg.extras.filter(function(ex){ return !wg.checkedItems["extra:" + ex.id]; });
      wg.checkedItems = {};
      persist();
      renderReceipt();
    });
    document.getElementById("clearWeekBtn").addEventListener("click", function(){
      if (!confirm("Clear all extras and checkmarks for this week? Recipe assignments will not be affected.")) return;
      wg.extras = [];
      wg.checkedItems = {};
      persist();
      renderReceipt();
    });
  }

  // ---------- Plan a New Month ----------
  function planNewMonth(newKey){
    if (!state.months[newKey]) state.months[newKey] = { days: {} };
    var newPm = parseMonthKey(newKey);
    var newDays = daysInMonth(newPm.year, newPm.month);

    var prevKey = addMonths(newKey, -1);
    if (!state.months[prevKey]) {
      var existing = Object.keys(state.months).filter(function(k){ return k !== newKey; }).sort();
      prevKey = existing.length ? existing[existing.length-1] : null;
    }

    if (prevKey && state.months[prevKey]) {
      var prevPm = parseMonthKey(prevKey);
      var prevDays = daysInMonth(prevPm.year, prevPm.month);
      for (var d = 1; d <= newDays; d++) {
        var sourceDay = ((d-1) % prevDays) + 1;
        var sourceIso = isoFromYMD(prevPm.year, prevPm.month, sourceDay);
        var destIso = isoFromYMD(newPm.year, newPm.month, d);
        var sourceData = state.months[prevKey].days[sourceIso];
        if (sourceData && sourceData.meals && Object.keys(sourceData.meals).length) {
          state.months[newKey].days[destIso] = { meals: Object.assign({}, sourceData.meals), extras: {} };
        }
      }
    }
    state.currentMonth = newKey;
    state.currentWeekIndex = 0;
    persist();
    renderAll();
  }

  function openPlanNewMonthModal(){
    var defaultNext = addMonths(state.currentMonth, 1);
    openModal(
      '<h2>Plan a New Month</h2>' +
      '<div class="modal-sub">Copies last month\'s meals by day number (day 1 &rarr; day 1, etc). You can edit any day after.</div>' +
      '<div class="field"><label for="planMonthInput">Month</label><input type="month" id="planMonthInput" value="' + defaultNext + '" data-autofocus></div>' +
      '<div class="modal-actions"><span class="spacer"></span><button type="button" class="pill-btn ghost" id="planCancelBtn">Cancel</button><button type="button" class="pill-btn primary" id="planConfirmBtn">Create</button></div>',
      { onMount: function(overlay, api){
        overlay.querySelector("#planCancelBtn").addEventListener("click", function(){ api.close(); });
        overlay.querySelector("#planConfirmBtn").addEventListener("click", function(){
          var val = overlay.querySelector("#planMonthInput").value;
          if (!val) return;
          api.close();
          planNewMonth(val);
        });
      }}
    );
  }

  // ---------- Clear all data ----------
  function clearAllData(){
    if (!confirm("Clear ALL recipes, snacks, goals, and month plans? If synced, this clears it for your whole household too. This cannot be undone.")) return;
    var cm = currentMonthKey();
    state.recipes = {};
    state.snacksLibrary = {};
    state.goals = defaultGoals();
    state.months = {};
    state.months[cm] = { days: {} };
    state.currentMonth = cm;
    state.currentWeekIndex = 0;
    state.grocery = {};
    persist();
    renderAll();
  }

  // ---------- Household sync banner (UI only; logic lives in module script) ----------
  function renderSyncBanner(status){
    status = status || (state.householdCode ? "connected" : "disconnected");
    syncBannerEl.className = "sync-banner" + (status === "connected" ? " connected" : status === "error" ? " error" : "");
    if (status === "connected") {
      syncBannerEl.innerHTML = '<span class="sync-dot"></span><span>Synced to household <strong>' + escapeHtml(state.householdCode) + '</strong></span>' +
        '<button type="button" class="pill-btn ghost small" id="changeHouseholdBtn2">Change</button>';
      var btn = syncBannerEl.querySelector("#changeHouseholdBtn2");
      if (btn) btn.addEventListener("click", openHouseholdModal);
    } else if (status === "error") {
      syncBannerEl.innerHTML = '<span class="sync-dot"></span><span>Sync error — working offline on this device</span>' +
        '<button type="button" class="pill-btn ghost small" id="retryHouseholdBtn">Settings</button>';
      var btn2 = syncBannerEl.querySelector("#retryHouseholdBtn");
      if (btn2) btn2.addEventListener("click", openHouseholdModal);
    } else {
      syncBannerEl.innerHTML = '<span class="sync-dot"></span><span>Not synced — this device only</span>' +
        '<button type="button" class="pill-btn primary small" id="setupHouseholdBtn">Set up sync</button>';
      var btn3 = syncBannerEl.querySelector("#setupHouseholdBtn");
      if (btn3) btn3.addEventListener("click", openHouseholdModal);
    }
  }

  function openHouseholdModal(){
    openModal(
      '<h2>Household sync</h2>' +
      '<div class="modal-sub">Share a code with your partner so recipes, goals, snacks, and month plans stay in sync. Works offline on each device if the connection drops.</div>' +
      (state.householdCode ? '<div class="field"><label>Current code</label><input type="text" value="' + escapeAttr(state.householdCode) + '" readonly></div>' : '') +
      '<div class="modal-actions" style="justify-content:flex-start;"><button type="button" class="pill-btn primary" id="createCodeBtn">Create new code</button></div>' +
      '<div class="field"><label for="joinCodeInput">Join existing code</label><div class="field-row"><input type="text" id="joinCodeInput" placeholder="ABC123" style="text-transform:uppercase;"><button type="button" class="pill-btn ghost" id="joinCodeBtn">Join</button></div></div>' +
      '<div class="modal-actions"><span class="spacer"></span><button type="button" class="pill-btn ghost" id="closeHouseholdBtn">Close</button></div>',
      { onMount: function(overlay, api){
        overlay.querySelector("#closeHouseholdBtn").addEventListener("click", function(){ api.close(); });
        overlay.querySelector("#createCodeBtn").addEventListener("click", function(){
          window.dispatchEvent(new CustomEvent("household-create"));
          api.close();
        });
        overlay.querySelector("#joinCodeBtn").addEventListener("click", function(){
          var code = overlay.querySelector("#joinCodeInput").value.trim().toUpperCase();
          if (!code) return;
          window.dispatchEvent(new CustomEvent("household-connect", { detail: { code: code } }));
          api.close();
        });
      }}
    );
  }

  window.addEventListener("household-status", function(ev){
    var d = ev.detail || {};
    if (d.code) state.householdCode = d.code;
    if (d.status === "disconnected") state.householdCode = null;
    saveLocal();
    renderSyncBanner(d.status, d.message);
  });
  window.addEventListener("household-remote-data", function(ev){
    var d = ev.detail || {};
    state.recipes = d.recipes || {};
    state.snacksLibrary = d.snacksLibrary || {};
    state.goals = d.goals || state.goals;
    state.months = d.months || {};
    state.grocery = d.grocery || {};
    saveLocal();
    renderAll();
  });

  // ---------- Wiring ----------
  document.getElementById("planNewMonthBtn").addEventListener("click", openPlanNewMonthModal);
  document.getElementById("recipesBtn").addEventListener("click", openRecipeLibrary);
  document.getElementById("goalsBtn").addEventListener("click", openGoalsModal);
  document.getElementById("clearAllBtn").addEventListener("click", clearAllData);
  document.getElementById("householdSettingsBtn").addEventListener("click", openHouseholdModal);
  monthSwitcherEl.addEventListener("change", function(){
    state.currentMonth = monthSwitcherEl.value;
    state.currentWeekIndex = 0;
    saveLocal();
    renderAll();
  });
  prevWeekBtn.addEventListener("click", function(){
    if (state.currentWeekIndex > 0) { state.currentWeekIndex--; saveLocal(); renderAll(); }
  });
  nextWeekBtn.addEventListener("click", function(){
    var weeks = currentWeeks();
    if (state.currentWeekIndex < weeks.length-1) { state.currentWeekIndex++; saveLocal(); renderAll(); }
  });

  function renderAll(){
    renderHeader();
    renderWeekNav();
    renderPlannerGrid();
    renderReceipt();
    renderSyncBanner();
  }

  renderAll();
  if (state.householdCode) {
    window.dispatchEvent(new CustomEvent("household-connect", { detail: { code: state.householdCode, silent: true } }));
  }
})();
</script>

<script type="module">
(async function(){
  var firebaseConfig = {
    apiKey: "AIzaSyBlCV5Ma5e43zBVFzFBZrAz24uoEb7FzEU",
    authDomain: "meal-planning-be4d5.firebaseapp.com",
    projectId: "meal-planning-be4d5",
    storageBucket: "meal-planning-be4d5.firebasestorage.app",
    messagingSenderId: "254110853549",
    appId: "1:254110853549:web:b77793d08587c8954cd924"
  };

  var db, fs;
  try {
    var appMod = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js");
    fs = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js");
    var app = appMod.initializeApp(firebaseConfig);
    db = fs.getFirestore(app);
    try { await fs.enableIndexedDbPersistence(db); } catch(e) {}
  } catch (e) {
    console.warn("Firebase failed to load — sync disabled, app continues offline.", e);
    return;
  }

  var unsub = null;
  var applyingRemote = false;
  var pushTimer = null;
  var currentCode = null;

  function status(s, extra){
    window.dispatchEvent(new CustomEvent("household-status", { detail: Object.assign({ status: s, code: currentCode }, extra||{}) }));
  }

  function schedulePush(data){
    if (!currentCode || applyingRemote) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function(){
      fs.setDoc(fs.doc(db, "households", currentCode), data).catch(function(e){
        console.warn("Household sync push failed", e);
      });
    }, 700);
  }

  function connect(code, silent){
    currentCode = code;
    if (unsub) { unsub(); unsub = null; }
    status("connecting");
    var ref = fs.doc(db, "households", code);
    fs.getDoc(ref).then(function(snap){
      if (snap.exists()) {
        applyingRemote = true;
        window.dispatchEvent(new CustomEvent("household-remote-data", { detail: snap.data() }));
        applyingRemote = false;
      } else if (!silent) {
        // brand new code: nothing remote yet, next local change will seed it
      }
      unsub = fs.onSnapshot(ref, function(s){
        if (!s.exists() || applyingRemote) return;
        applyingRemote = true;
        window.dispatchEvent(new CustomEvent("household-remote-data", { detail: s.data() }));
        applyingRemote = false;
      }, function(err){
        console.warn("Household listener error", err);
        status("error", { message: err.message });
      });
      status("connected");
    }).catch(function(e){
      console.warn("Household connect failed", e);
      status("error", { message: e.message });
    });
  }

  window.addEventListener("household-connect", function(ev){
    var d = ev.detail || {};
    connect(d.code, d.silent);
  });
  window.addEventListener("household-create", function(){
    var code = Math.random().toString(36).slice(2,8).toUpperCase();
    connect(code, false);
  });
  window.addEventListener("household-local-change", function(ev){
    schedulePush(ev.detail);
  });
})();
</script>
</body>
</html>
